name: Update BOOTH hearts

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booth-hearts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch heart counts
        run: node scripts/update-booth.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/booth.json; then
            echo "No change in data/booth.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/booth.json
          git commit -m "Update BOOTH heart counts"
          git push
